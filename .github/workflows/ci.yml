name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Generate icons
        run: npm run generate-icons

      - name: Build
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:ext

      - name: Package Chrome
        run: npm run package:chrome

      - name: Package Firefox
        run: npm run package:firefox

      - uses: actions/upload-artifact@v4
        with:
          name: tenebra-packages
          path: web-ext-artifacts/
          if-no-files-found: error
